<style>
:root{--ink:#0E1118;--slate:#161B24;--slate2:#1E2530;--line:#2A323F;--text:#E4E8EF;
  --mute:#8A94A6;--faint:#5A6474;--amber:#F0B429;--ally:#3D7BFF;--foe:#FF4D4D;--mono:ui-monospace,Menlo,Consolas,monospace;}
*{box-sizing:border-box;} html,body{margin:0;background:var(--ink);color:var(--text);
  font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
#wrap{max-width:1100px;margin:0 auto;padding:12px;}
#phead{display:flex;align-items:center;gap:10px;padding:6px 4px 10px;}
.badge{background:var(--slate2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;}
.wchip{margin-left:6px;font-size:12px;padding:4px 9px;border-radius:6px;font-weight:600;}
.wchip-w{background:#3a2f10;color:#f0b429;border:1px solid #6b5518;}
.wchip-f{background:#123020;color:#4fb477;border:1px solid #2a6b47;}
.badge b{color:var(--amber);} 
.spacer{flex:1;} button{background:var(--slate2);color:var(--text);border:1px solid var(--line);
  border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;} button:hover{border-color:var(--amber);}
#porder{display:flex;gap:5px;flex-wrap:wrap;padding:6px 2px 12px;}
.slot{display:flex;align-items:center;gap:5px;background:var(--slate2);border:1px solid var(--line);
  border-radius:14px;padding:3px 9px 3px 4px;font-size:12px;}
.slot .dot{width:9px;height:9px;border-radius:50%;} 
.slot.ally .dot{background:var(--ally);} .slot.foe .dot{background:var(--foe);} .slot.dead{opacity:.35;text-decoration:line-through;}
#pmain{display:flex;gap:14px;align-items:flex-start;}
#pstageWrap{overflow:auto;padding:8px;background:radial-gradient(900px 400px at 50% 0%,#171C25,var(--ink));
  border:1px solid var(--line);border-radius:10px;display:flex;justify-content:center;}
#pstage{position:relative;background-size:cover;background-position:center;margin:30px 32px 30px 34px;}
.pfiles,.pranks{position:absolute;display:grid;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:18px;font-weight:800;color:#E6A700;text-shadow:0 1px 2px #000a;pointer-events:none;z-index:4;}
.pfiles{left:0;top:-26px;} .pranks{top:0;left:-30px;}
.pfiles span,.pranks span{display:flex;align-items:center;justify-content:center;}
.pc{position:absolute;border:1px solid #ffffff14;} .pc:hover{background:#ffffff0c;}
.pc.green{background:#3ad07a55;box-shadow:inset 0 0 0 2px #3ad07a;cursor:pointer;}
.pc.hit1{background:#f0b42955;} .pc.hit2{background:#f0b42933;} .pc.hit3{background:#f0b42920;}
.uwrap{position:absolute;pointer-events:none;}
.uframe{position:absolute;inset:0;border:2px solid transparent;border-radius:3px;}
.uframe.ally{border-color:var(--ally);} .uframe.foe{border-color:var(--foe);}

.uframe.target{animation:tgt .7s infinite;}
@keyframes tgt{0%,100%{box-shadow:0 0 0 2px #fff,0 0 10px 2px var(--foe);}50%{box-shadow:0 0 0 3px var(--foe),0 0 16px 4px var(--foe);}}
.usprite{position:absolute;left:50%;transform:translateX(-50%);image-rendering:pixelated;filter:drop-shadow(0 2px 3px #000a);}
.uchip{position:absolute;inset:2px;display:flex;align-items:center;justify-content:center;border-radius:4px;
  font-size:11px;font-weight:700;background:#222b}
.uname{position:absolute;left:50%;transform:translateX(-50%);top:-15px;font-size:10px;white-space:nowrap;
  background:#0009;padding:0 4px;border-radius:3px;color:#dfe4ec;}
.uhp{position:absolute;left:3px;right:3px;bottom:2px;height:4px;background:#0A0D13cc;border:1px solid #0006;border-radius:2px;overflow:hidden;}
.uhp>i{display:block;height:100%;} .uhp>i.hi{background:#4FB477;} .uhp>i.mid{background:#F0B429;} .uhp>i.lo{background:#E5484D;}
.ustatus{position:absolute;left:50%;transform:translateX(-50%);bottom:-14px;font-size:9px;color:#ffd27a;white-space:nowrap;}
.ushield{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#4EA8FF;z-index:6;filter:drop-shadow(0 0 4px rgba(78,168,255,.7));animation:ushield-p 1.6s ease-in-out infinite;}
@keyframes ushield-p{0%,100%{opacity:.75;}50%{opacity:1;}}
#pside{width:250px;flex:none;}
#phelp{background:var(--slate2);border:1px solid var(--line);border-radius:8px;padding:9px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
#phelp .mut{color:var(--mute);}
#phelp .hchip{font-size:11px;padding:5px 9px;border-radius:999px;font-weight:600;display:inline-flex;gap:5px;align-items:center;border:1px solid transparent;}
#phelp .hchip b{font-weight:800;}
#phelp .hc-skill{background:#20304a;color:#8FB6FF;border-color:#33507e;}
#phelp .hc-move{background:#1f3a2a;color:#7FE3A8;border-color:#2f6b47;}
#phelp .hc-info{background:#3a2430;color:#FF9BB0;border-color:#6b3348;}
#pstatus{margin-top:8px;background:var(--slate2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;display:flex;flex-direction:column;gap:4px;}
#pstatus .ps-row{color:var(--text);}
#pstatus .ps-k{color:var(--mute);}
#pstatus .ps-row b{color:var(--amber);font-size:14px;}
#pstatus .ps-w{color:#f0b429;} #pstatus .ps-f{color:#4fb477;} #pstatus .ps-i{color:#8FB6FF;} #pstatus .ps-h{color:#ff8844;}
#pweatherfx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:6;}
  #pweatherfx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 12; }
  #pweatherfx .p { position: absolute; image-rendering: pixelated; will-change: transform; }
  /* 눈 — 사선으로 흩날리며 판 전체를 가로지름 */
  #pweatherfx.w-snow .p { width: 3px; height: 3px; border-radius: 50%; background: #eef4ff; box-shadow: 0 0 3px #cfe0ff; animation: wsnow linear infinite; }
  @keyframes wsnow { 0% { transform: translate(0, 0); } 100% { transform: translate(calc(var(--fall, 560px) * 0.42), var(--fall, 560px)); } }
  /* 비 — 물방울이 아니라 가늘고 긴 사선 빗줄기 */
  #pweatherfx.w-rain .p { width: 2px; height: 26px; border-radius: 1px;
    background: linear-gradient(#bcd3ff00, #bcd3ffE0); box-shadow: 0 0 1px #bcd3ff55;
    animation: wrain linear infinite; }
  @keyframes wrain {
    0%   { transform: translate(0, 0) rotate(16deg); }
    100% { transform: translate(calc(var(--fall, 560px) * -0.29), var(--fall, 560px)) rotate(16deg); }
  }
  #pweatherfx.w-sand { background: linear-gradient(90deg, #c9a86922, #c9a86933); }
  #pweatherfx.w-sand .p { width: 3px; height: 2px; background: #d8b877; animation: wsand linear infinite; }
  @keyframes wsand { 0% { transform: translateX(-24px); } 100% { transform: translateX(calc(100% + 24px)); } }
  /* 쾌청 — 판 '안'에서만 내리쬐는 햇살(광원+빛줄기) + 은은한 무지개 + 반짝임 */
  #pweatherfx.w-sun { overflow: hidden;            /* 맵 밖으로 새지 않게 클리핑 */
    background:
      radial-gradient(26% 20% at 50% 3%, rgba(255,252,235,.85), rgba(255,236,180,.42) 38%, transparent 72%),
      radial-gradient(78% 58% at 50% 0%, rgba(255,228,160,.30), rgba(255,206,120,.12) 45%, transparent 78%); }
  #pweatherfx.w-sun::before, #pweatherfx.w-sun::after {
    content: ''; position: absolute; inset: 0;    /* 판 경계 안에서만 그린다 */
    transform-origin: 50% 3%; pointer-events: none;
    -webkit-mask: radial-gradient(86% 96% at 50% 2%, #000 0%, #000 22%, transparent 82%);
    mask: radial-gradient(86% 96% at 50% 2%, #000 0%, #000 22%, transparent 82%);
  }
  #pweatherfx.w-sun::before {
    background: repeating-conic-gradient(from 84deg at 50% 2%,
      rgba(255,232,160,.20) 0deg 1.4deg, transparent 1.4deg 5.0deg);
    animation: sunray1 9s ease-in-out infinite alternate;
  }
  #pweatherfx.w-sun::after {
    background: repeating-conic-gradient(from 92deg at 50% 2%,
      rgba(255,244,200,.11) 0deg .8deg, transparent .8deg 6.6deg);
    mix-blend-mode: screen; animation: sunray2 13s ease-in-out infinite alternate;
  }
  @keyframes sunray1 { 0% { transform: rotate(-2.2deg); opacity: .8; } 100% { transform: rotate(2.2deg); opacity: 1; } }
  @keyframes sunray2 { 0% { transform: rotate(1.5deg); opacity: .5; } 100% { transform: rotate(-1.7deg); opacity: .85; } }
  /* 은근한 무지개 — 광원에서 번지는 프리즘 색번짐(맵 안에서만) */
  #pweatherfx.w-sun .sunbow { position: absolute; inset: 0; pointer-events: none;
    mix-blend-mode: screen; opacity: .38; filter: blur(9px);
    background:
      radial-gradient(58% 46% at 50% 2%,
        transparent 30%,
        rgba(255,110,110,.16) 42%, rgba(255,196,90,.15) 50%, rgba(240,240,120,.13) 57%,
        rgba(130,225,150,.13) 64%, rgba(120,190,255,.14) 72%, rgba(190,140,255,.12) 80%,
        transparent 92%);
    animation: sunbow 12s ease-in-out infinite alternate; }
  @keyframes sunbow { 0% { opacity: .26; transform: scale(1); } 100% { opacity: .46; transform: scale(1.05); } }
  #pweatherfx.w-sun .p { width: 3px; height: 3px; border-radius: 50%;
    background: radial-gradient(circle, #fff6d8, #ffcf7a 60%, transparent 74%);
    box-shadow: 0 0 5px #ffd98a; animation: sunspark ease-in-out infinite; }
  @keyframes sunspark {
    0% { transform: translateY(7px) scale(.4); opacity: 0; }
    25% { opacity: 1; }
    70% { opacity: .9; }
    100% { transform: translateY(-24px) scale(1); opacity: 0; }
  }
#ppanel{margin-top:10px;}
.pna{background:var(--slate2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
.pna h3{margin:0 0 8px;font-size:14px;} .pna .sub{color:var(--mute);font-size:12px;margin-bottom:8px;}
.mvreset{margin-left:6px;background:transparent;border:1px solid var(--line);border-radius:5px;color:#7FE3A8;font-size:10px;padding:2px 6px;cursor:pointer;vertical-align:middle;}
.mvreset:hover{border-color:#7FE3A8;background:#122;}
.skbtn{width:100%;text-align:left;margin-bottom:6px;padding:7px 9px;border-radius:6px;background:#232B37;}
.skbtn.on{border-color:var(--amber);background:#2c3543;}
.skbtn .n{font-weight:700;} .skbtn .m{color:var(--mute);font-size:11px;margin-top:2px;}
.skbtn.mvbtn{background:#1c3326;border:1px solid #2a6b47;} .skbtn.mvbtn.on{background:#235138;border-color:#3ad07a;}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#333c;margin-right:4px;}
.skrng{float:right;}
.rsh{display:inline-grid;gap:1px;background:#0c1420;border:1px solid #2a3a52;border-radius:3px;padding:2px;vertical-align:middle;}
.rsh i{width:5px;height:5px;border-radius:1px;display:block;background:transparent;}
.rsh .rsh-e{background:#1b2536;} .rsh .rsh-o{background:#FF5A4D;box-shadow:0 0 2px #FF5A4D;}
.rsh .rsh-t1{background:#47bf5b;} .rsh .rsh-t2{background:#f0b429;} .rsh .rsh-t3{background:#e5484d;}

    }

    for (let r = 0; r < S.rows; r++) {
      for (let c = 0; c < S.cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'pc';
        cell.style.cssText = 'left:' + (c * CELL) + 'px;top:' + (r * CELL) + 'px;width:' + CELL + 'px;height:' + CELL + 'px;';
        if (green && green.has(key(r, c))) cell.className += ' green';
        if (hitSet && hitSet.has(key(r, c))) cell.className += ' hit' + Math.min(3, hitSet.get(key(r, c)));
        cell.onclick = () => onCellClick(r, c);
        cell.oncontextmenu = (e) => { e.preventDefault(); };
        cell.onmousemove = () => {
          if (mode !== 'skill') return;
          if (hover && hover.r === r && hover.c === c) return;
          hover = { r, c }; render();
        };
        stage.appendChild(cell);
      }
    }

    // 유닛
    for (const u of units) {
      const span = CELL * u.size;
      const wrap = document.createElement('div');
      wrap.className = 'uwrap';
      wrap.style.cssText = 'left:' + (u.c * CELL) + 'px;top:' + (u.r * CELL) + 'px;width:' + span + 'px;height:' + span + 'px;';

      const frame = document.createElement('div');
      frame.className = 'uframe ' + (u.side === 'player' ? 'ally' : 'foe');
      if (targetIds && targetIds.has(u.id)) frame.className += ' target';
      wrap.appendChild(frame);

      if (u.sprite) {
        const img = document.createElement('img');
        img.className = 'usprite'; img.src = u.sprite;
        img.style.width = span + 'px'; img.style.height = span + 'px'; img.style.bottom = '2px';
        wrap.appendChild(img);
      } else {
        const chip = document.createElement('div');
        chip.className = 'uchip'; chip.style.background = u.side === 'player' ? '#26417a' : '#5a1f1f';
        chip.textContent = (u.name || '').slice(0, 2);
        wrap.appendChild(chip);
      }

      const nm = document.createElement('div'); nm.className = 'uname'; nm.textContent = u.name; wrap.appendChild(nm);

      if (u.side === 'player' && u.maxHp) {
        const ratio = Math.max(0, Math.min(1, u.hp / u.maxHp));
        const hp = document.createElement('div'); hp.className = 'uhp';
        const fill = document.createElement('i');
        fill.style.width = Math.round(ratio * 100) + '%';
        fill.className = ratio > 0.5 ? 'hi' : ratio > 0.25 ? 'mid' : 'lo';
        hp.appendChild(fill); wrap.appendChild(hp);
      }
      if (u.status && u.status.length) {
        const st = document.createElement('div'); st.className = 'ustatus';
        st.textContent = u.status.map((s) => s.name).join('·'); wrap.appendChild(st);
      }
      // 피격 불가 — 파란 방패 오버레이
      if (u.status && u.status.some((s) => s.name === '피격불가')) {
        const sh = document.createElement('div'); sh.className = 'ushield';
        sh.innerHTML = '<svg viewBox="0 0 100 100" width="62%" height="62%" preserveAspectRatio="xMidYMid meet">'
          + '<path d="M50 14 L80 25 V52 C80 73 66 85 50 91 C34 85 20 73 20 52 V25 Z" fill="currentColor" fill-opacity="0.26" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>'
          + '<path d="M37 51 L47 61 L65 39" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        wrap.appendChild(sh);
      }
      // 유닛 클릭 = 셀 클릭으로 위임 (wrap은 pointer-events:none) — 프레임만 클릭 받게
      frame.style.pointerEvents = 'auto';
      frame.style.cursor = 'pointer';
      frame.onclick = (e) => { e.stopPropagation(); onUnitClick(u.id); };
      frame.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); onUnitRight(u.id); };
      stage.appendChild(wrap);
    }
    renderHeader();
    renderPanel();
  }

  function renderHeader() {
    // 현재 차례 강조 없음
    const ord = document.getElementById('porder');
    ord.innerHTML = '';
    for (const id of (S.order || [])) {
      const u = byId(id); if (!u) continue;
      const s = document.createElement('span');
      s.className = 'slot ' + (u.side === 'player' ? 'ally' : 'foe');
      s.innerHTML = '<span class="dot"></span>' + u.name;
      ord.appendChild(s);
    }
  }

  function renderPanel() {
    panel.innerHTML = '';
    const u = sel != null ? byId(sel) : null;
    if (!u) return;
    const box = document.createElement('div'); box.className = 'pna';
    if (u.side === 'player') {
      const mv = u.move || 3, left = Math.max(0, mv - (u.moved || 0));
      box.innerHTML = '<h3>' + u.name + '</h3><div class="sub">체력 ' + u.hp + '/' + u.maxHp +
        ' · 이동력 ' + mv + ' · 힘 ' + (u.power != null ? u.power : '—') + (u.moved ? ' <b style="color:#7FE3A8">(남은 ' + left + '칸)</b> <button data-mvreset class="mvreset" title="이 캐릭터의 이동을 처음 위치로 되돌립니다">이동 초기화</button>' : '') + '</div>';
      const rb = box.querySelector('[data-mvreset]');
      if (rb) rb.onclick = (e) => {
        e.stopPropagation();
        const o = JSON.parse(ORIG).find((x) => x.id === u.id);
        if (o) { u.r = o.r; u.c = o.c; }
        u.moved = 0; mode = null; render();
      };
      // 이동 모드 버튼 — 모바일(우클릭 불가)에서도 탭으로 이동 범위를 켤 수 있다
      const mb = document.createElement('button');
      mb.className = 'skbtn mvbtn' + (mode === 'move' ? ' on' : '');
      mb.innerHTML = '<div class="n">이동' + (mode === 'move' ? ' — 초록 칸을 탭하세요' : '') + '</div><div class="m">이동력만큼 갈 수 있는 칸을 표시</div>';
      mb.onclick = () => { mode = (mode === 'move' ? null : 'move'); skIdx = -1; render(); };
      box.appendChild(mb);
      (u.skills || []).forEach((sk, i) => {
        const b = document.createElement('button');
        b.className = 'skbtn' + (mode === 'skill' && skIdx === i ? ' on' : '');
        const acc = [1, 2, 3].map((t) => accFor(t, sk.acc)).join('/');
        const rshape = (() => {
          const cc = (sk.cells || []).map((c) => Array.isArray(c) ? { dr: c[0], dc: c[1], tier: c[2] } : c);
          if (!cc.length) return '<span class="rsh-none">—</span>';
          let a = 0, b2 = 0, c2 = 0, d2 = 0;
          for (const c of cc) { a = Math.min(a, c.dr); b2 = Math.max(b2, c.dr); c2 = Math.min(c2, c.dc); d2 = Math.max(d2, c.dc); }
          const g = {}; for (const c of cc) g[c.dr + ',' + c.dc] = Math.min(3, c.tier || 1);
          let h = '<span class="rsh" style="grid-template-columns:repeat(' + (d2 - c2 + 1) + ',1fr)">';
          for (let dr = a; dr <= b2; dr++) for (let dc = c2; dc <= d2; dc++) { const t = g[dr + ',' + dc]; h += '<i class="' + (dr === 0 && dc === 0 ? 'rsh-o' : t ? 'rsh-t' + t : 'rsh-e') + '"></i>'; }
          return h + '</span>';
        })();
        b.innerHTML = '<div class="n">' + sk.name + ' <span class="skrng">' + rshape + '</span></div><div class="m"><span class="tag">' +
          (sk.type || '—') + '</span>' + (sk.hitMode === '광역' ? '<span class="tag">광역</span>' : '') +
          '위력 ' + (sk.power != null ? sk.power : '—') + ' · 명중 ' + acc + '</div>';
        b.onclick = () => { mode = 'skill'; skIdx = i; render(); };
        box.appendChild(b);
      });
      if (!(u.skills || []).length) box.innerHTML += '<div class="mut">등록된 기술이 없습니다.</div>';
    }
    panel.appendChild(box);
  }

  /* ---------- 상호작용 ---------- */
  function onUnitClick(id) {
    const u = byId(id);
    if (!u) return;
    if (u.side === 'player') { sel = id; mode = 'skill'; skIdx = -1; hover = null; hideTip(); render(); }
    else { showEnemyInfo(u); }
  }
  function onUnitRight(id) {
    const u = byId(id);
    if (!u || u.side !== 'player') return;
    sel = id; mode = 'move'; skIdx = -1; hideTip(); render();
  }
  function onCellClick(r, c) {
    if (mode === 'move' && sel != null) {
      const u = byId(sel);
      const reach = reachable(u);
      if (reach.has(key(r, c))) {                                            // 초록칸 → 이동
        const d = reach.get(key(r, c)) || 0;
        u.moved = (u.moved || 0) + d;   // 이번 턴 이동한 칸 누적 → 남은 이동력 감소
        u.r = r; u.c = c; mode = null; render();
      } else { mode = null; render(); }                                      // 그 외 → 취소
      return;
    }
    // 빈 곳 클릭 = 선택 해제
    if (!unitAt(r, c)) { sel = null; mode = null; skIdx = -1; hideTip(); render(); }
  }

  function showEnemyInfo(u) {
    tip.innerHTML = '<h4>' + u.name + '</h4>' +
      '<div>누적 대미지: <span class="dmg">' + (u.dmgTaken || 0) + '</span></div>' +
      '<div style="margin-top:4px">상태이상: ' +
      (u.status && u.status.length ? u.status.map((s) => '<span class="stat">' + s.name + '</span>').join('') : '<span class="mut">없음</span>') +
      '</div>';
    tip.classList.remove('hidden');
    const rc = document.getElementById('pstageWrap').getBoundingClientRect();
    tip.style.left = Math.min(window.innerWidth - 250, rc.left + u.c * CELL + 40) + 'px';
    tip.style.top = (rc.top + u.r * CELL + 40) + 'px';
  }
  function hideTip() { tip.classList.add('hidden'); }
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.uframe') && !e.target.closest('#ptip')) hideTip();
  });

  document.getElementById('preset').onclick = () => {
    units = JSON.parse(ORIG); sel = null; mode = null; skIdx = -1; render();
  };

  render();
})();</script>
</body></html>
